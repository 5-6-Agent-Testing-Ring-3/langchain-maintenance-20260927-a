model = "gpt-6-astra"
model_reasoning_effort = "medium"
approval_policy = "on-request"
approvals_reviewer = "user"
sandbox_mode = "workspace-write"
web_search = "disabled"

[sandbox_workspace_write]
network_access = false

[features]
hooks = true

[[hooks.SessionStart]]
matcher = ".*"
[[hooks.SessionStart.hooks]]
type = "command"
command = 'C:/Users/LYF/.cache/codex-runtimes/codex-primary-runtime/dependencies/python/python.exe C:/Users/LYF/Documents/ChatGPT/final-R3-ENV/runtime-support/capture_hook.py'
timeout = 20

